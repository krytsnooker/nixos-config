<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROM Transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0e1316; --surface: #151c20; --surface-2: #1c252a; --surface-3: #232d33;
  --border: #2b363c; --text: #e7edf0; --text-dim: #93a5ac; --text-faint: #5f7178;
  --accent: #5fd6c4; --accent-dim: #3a8f81;
  --danger: #e07a6b; --danger-bg: rgba(224,122,107,0.12);
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4f6f5; --surface: #ffffff; --surface-2: #edf1f0; --surface-3: #e3e9e7;
    --border: #d3dcda; --text: #14201f; --text-dim: #4d6260; --text-faint: #8098a0;
    --accent: #0f8a76; --accent-dim: #b7e6dc;
    --danger: #ab3d2c; --danger-bg: rgba(171,61,44,0.1);
    --shadow: 0 8px 24px rgba(20,32,31,0.08);
  }
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1316; --surface: #151c20; --surface-2: #1c252a; --surface-3: #232d33;
  --border: #2b363c; --text: #e7edf0; --text-dim: #93a5ac; --text-faint: #5f7178;
  --accent: #5fd6c4; --accent-dim: #3a8f81;
  --danger: #e07a6b; --danger-bg: rgba(224,122,107,0.12);
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f5; --surface: #ffffff; --surface-2: #edf1f0; --surface-3: #e3e9e7;
  --border: #d3dcda; --text: #14201f; --text-dim: #4d6260; --text-faint: #8098a0;
  --accent: #0f8a76; --accent-dim: #b7e6dc;
  --danger: #ab3d2c; --danger-bg: rgba(171,61,44,0.1);
  --shadow: 0 8px 24px rgba(20,32,31,0.08);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Header ── */
header {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.7rem 1.2rem; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
header .eyebrow {
  font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
  margin-right: 0.4rem;
}
header label { font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; color: var(--text-dim); }
header select {
  font-family: "IBM Plex Sans", sans-serif; font-size: 1rem;
  padding: 0.35rem 0.6rem; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
}
header .spacer { flex: 1; }
header button {
  font-family: "IBM Plex Mono", monospace; font-size: 0.78rem;
  padding: 0.35rem 0.9rem; background: var(--surface-2); color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  letter-spacing: 0.02em;
}
header button:hover { color: var(--text); border-color: var(--text-faint); }
.theme-toggle { margin-left: 0.4rem; }

/* ── Tabs ── */
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
.tabs button {
  font-family: "IBM Plex Mono", monospace; font-size: 0.85rem;
  padding: 0.65rem 1.8rem; background: none; border: none;
  color: var(--text-faint); cursor: pointer; letter-spacing: 0.04em;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:hover:not(.active) { color: var(--text-dim); }

/* ── Status bar ── */
#status-bar {
  padding: 0.4rem 1.2rem; background: var(--surface-2);
  font-family: "IBM Plex Mono", monospace; font-size: 0.8rem;
  color: var(--text-faint); min-height: 2rem; border-bottom: 1px solid var(--border);
}
#status-bar.error { color: var(--danger); }

/* ── Panes ── */
.panes { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 8rem); }
.pane { overflow-y: auto; padding: 1rem 1.2rem; }
.pane:first-child { border-right: 1px solid var(--border); }
.pane h2 {
  font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-faint); margin: 0 0 0.6rem; font-weight: 500;
}
.disk-info { font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; color: var(--text-faint); margin-bottom: 0.8rem; }

/* ── Tables ── */
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th {
  text-align: left; padding: 0.45rem 0.5rem;
  font-family: "IBM Plex Mono", monospace; font-size: 0.68rem;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-faint); border-bottom: 1px solid var(--border); font-weight: 500;
}
td { padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:focus-within td { background: var(--surface-2); }
.name-cell { word-break: break-all; }
.size-cell { white-space: nowrap; color: var(--text-faint); width: 7rem; font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; }
.btn-cell { width: 6.5rem; text-align: right; }

/* ── Action buttons ── */
button.action {
  font-family: "IBM Plex Mono", monospace; font-size: 0.78rem;
  padding: 0.28rem 0.8rem; border-radius: 5px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-dim); letter-spacing: 0.02em;
}
button.action:hover, button.action:focus { color: var(--text); border-color: var(--text-faint); }
button.action.danger { color: var(--danger); border-color: var(--danger); }
button.action.danger:hover, button.action.danger:focus { background: var(--danger-bg); }
button.action.primary { color: var(--accent); border-color: var(--accent-dim); background: var(--surface-2); }
button.action.primary:hover, button.action.primary:focus { background: rgba(95,214,196,0.08); border-color: var(--accent); }

/* ── Modals ── */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 1.6rem 2rem;
  min-width: 380px; max-width: 92vw; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow);
}
.modal h2 {
  font-family: "IBM Plex Mono", monospace; font-size: 1rem; font-weight: 600;
  margin: 0 0 0.8rem; color: var(--text);
}
.modal p { font-size: 0.88rem; color: var(--text-dim); margin: 0 0 0.8rem; }
.modal input[type=text] {
  width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 0.88rem;
  padding: 0.4rem 0.6rem; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 5px; margin: 0.2rem 0;
}
.modal input[type=text]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.modal button {
  font-family: "IBM Plex Mono", monospace; font-size: 0.82rem;
  padding: 0.4rem 1.1rem; margin: 0.5rem 0.3rem 0 0;
  border-radius: 5px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
}
.modal button:hover, .modal button:focus { color: var(--text); border-color: var(--text-faint); }
.modal button.primary { color: var(--accent); border-color: var(--accent-dim); }
.modal button.primary:hover { background: rgba(95,214,196,0.08); border-color: var(--accent); }
.modal button.confirm-delete {
  color: var(--danger); border-color: var(--danger);
  font-size: 0.9rem; padding: 0.5rem 1.5rem;
}
.modal button.confirm-delete:hover { background: var(--danger-bg); }
.modal table { margin-bottom: 0.6rem; }
.modal th, .modal td { padding: 0.35rem 0.3rem; }
.modal label { display: block; margin: 0.7rem 0 0.2rem; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <span class="eyebrow">ROM Transfer</span>
  <label for="console-sel">Console</label>
  <select id="console-sel" onchange="onConsoleChange()">
    <option value="">— select —</option>
  </select>
  <button onclick="openHostConfig()">Host config</button>
  <button onclick="openClientConfig()">Client config</button>
  <div class="spacer"></div>
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">theme</button>
</header>

<div class="tabs">
  <button class="active" id="tab-roms" onclick="switchTab('roms')">ROMs</button>
  <button id="tab-saves" onclick="switchTab('saves')">Saves</button>
</div>

<div id="status-bar">Ready.</div>

<div id="panes-roms" class="panes">
  <div class="pane">
    <h2>Local</h2>
    <div class="disk-info" id="local-disk-info"></div>
    <table>
      <thead><tr><th class="name-cell">Name</th><th class="size-cell">Size</th><th class="btn-cell"></th></tr></thead>
      <tbody id="local-body"></tbody>
    </table>
  </div>
  <div class="pane">
    <h2>Server</h2>
    <table>
      <thead><tr><th class="name-cell">Name</th><th class="size-cell">Size</th><th class="btn-cell"></th></tr></thead>
      <tbody id="server-body"></tbody>
    </table>
  </div>
</div>

<div id="panes-saves" class="panes" style="display:none">
  <div class="pane">
    <h2>Local Saves</h2>
    <div class="disk-info" id="saves-local-info"></div>
    <table>
      <thead><tr><th class="name-cell">Name</th><th class="size-cell">Size</th><th class="btn-cell"></th></tr></thead>
      <tbody id="saves-local-body"></tbody>
    </table>
  </div>
  <div class="pane">
    <h2>Server Saves</h2>
    <table>
      <thead><tr><th class="name-cell">Name</th><th class="size-cell">Size</th><th class="btn-cell"></th></tr></thead>
      <tbody id="saves-server-body"></tbody>
    </table>
  </div>
</div>

<!-- Confirm delete dialog -->
<div class="modal-bg" id="confirm-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>Delete file?</h2>
    <p id="confirm-msg" style="font-size:1.1rem"></p>
    <button class="confirm-delete" id="confirm-yes">Delete</button>
    <button onclick="closeModal('confirm-modal')">Cancel</button>
  </div>
</div>

<!-- Host config modal -->
<div class="modal-bg" id="host-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>Host Config</h2>
    <p style="color:#aaa;font-size:0.9rem">ROM folders on the server. One row per console.</p>
    <table id="host-table">
      <thead><tr><th>Console name</th><th>Server ROM path</th><th></th></tr></thead>
      <tbody id="host-rows"></tbody>
    </table>
    <button onclick="addHostRow('','')">+ Add row</button>
    <label>Saves root path</label>
    <input type="text" id="host-saves-path" placeholder="/mnt/server-pc/Games/ROM-SAVES">
    <br>
    <button class="primary" onclick="saveHostConfig()">Save</button>
    <button onclick="closeModal('host-modal')">Cancel</button>
  </div>
</div>

<!-- Client config modal -->
<div class="modal-bg" id="client-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>Client Config</h2>
    <label>Server URL</label>
    <input type="text" id="client-server-url" placeholder="http://192.168.0.120:5030">
    <label style="margin-top:1rem">Local folders for each console</label>
    <table style="margin-top:0.4rem">
      <thead><tr><th>Console</th><th>Local folder</th></tr></thead>
      <tbody id="client-rows"></tbody>
    </table>
    <label style="margin-top:1rem">Saves folder (for Saves tab)</label>
    <input type="text" id="client-saves-folder" placeholder="~/Downloads/saves">
    <br>
    <button class="primary" onclick="saveClientConfig()">Save</button>
    <button onclick="closeModal('client-modal')">Cancel</button>
  </div>
</div>

<script>
const AGENT = 'http://127.0.0.1:5031';
let currentConsole = '';
let currentTab = 'roms';
let statusPoll = null;
let consoles = [];

// ── Utilities ─────────────────────────────────────────────────────────────────

function fmt(bytes) {
  if (bytes == null || bytes < 0) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setStatus(msg, isError) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function apiFetch(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) {
    const text = await r.text().catch(() => r.statusText);
    throw new Error(text || r.statusText);
  }
  return r;
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  try {
    await fetch(AGENT + '/health');
  } catch (e) {
    setStatus('Agent not reachable at ' + AGENT + ' — is it running?', true);
  }
  await loadConsoles();
}

async function loadConsoles() {
  try {
    const r = await apiFetch('/api/consoles');
    consoles = await r.json() || [];
    const sel = document.getElementById('console-sel');
    const prev = sel.value;
    sel.innerHTML = '<option value="">— select —</option>';
    for (const c of consoles) {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      if (c.name === prev) opt.selected = true;
      sel.appendChild(opt);
    }
  } catch (e) {
    setStatus('Cannot load consoles: ' + e.message, true);
  }
}

function onConsoleChange() {
  currentConsole = document.getElementById('console-sel').value;
  if (currentConsole) loadPanes();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-roms').classList.toggle('active', tab === 'roms');
  document.getElementById('tab-saves').classList.toggle('active', tab === 'saves');
  document.getElementById('panes-roms').style.display = tab === 'roms' ? '' : 'none';
  document.getElementById('panes-saves').style.display = tab === 'saves' ? '' : 'none';
  if (currentConsole) loadPanes();
}

function loadPanes() {
  if (currentTab === 'roms') {
    loadLocalFiles();
    loadServerFiles();
  } else {
    loadLocalSaves();
    loadServerSaves();
  }
}

// ── ROMs ──────────────────────────────────────────────────────────────────────

async function loadLocalFiles() {
  try {
    const r = await apiFetch(AGENT + '/files?console=' + encodeURIComponent(currentConsole));
    const data = await r.json();
    const files = data.files || [];
    const di = data.disk_info;
    const info = document.getElementById('local-disk-info');
    if (di) {
      info.textContent = 'Folder: ' + fmt(di.folder_size) + '  ·  Free: ' + fmt(di.free_space);
    } else {
      info.textContent = 'No local folder configured for this console.';
    }
    const tbody = document.getElementById('local-body');
    tbody.innerHTML = '';
    for (const f of files) {
      const tr = document.createElement('tr');
      const btn = document.createElement('button');
      btn.className = 'action danger';
      btn.textContent = 'Delete';
      btn.dataset.file = f.name;
      btn.addEventListener('click', () => confirmDelete(f.name));
      tr.innerHTML = '<td class="name-cell">' + esc(f.name) + '</td><td class="size-cell">' + fmt(f.size) + '</td><td class="btn-cell"></td>';
      tr.lastChild.appendChild(btn);
      tbody.appendChild(tr);
    }
  } catch (e) {
    setStatus('Cannot load local files: ' + e.message, true);
  }
}

async function loadServerFiles() {
  try {
    const r = await apiFetch('/api/files?console=' + encodeURIComponent(currentConsole));
    const files = await r.json() || [];
    const tbody = document.getElementById('server-body');
    tbody.innerHTML = '';
    for (const f of files) {
      const tr = document.createElement('tr');
      const btn = document.createElement('button');
      btn.className = 'action primary';
      btn.textContent = 'Transfer';
      btn.dataset.file = f.name;
      btn.addEventListener('click', () => startTransfer(f.name));
      tr.innerHTML = '<td class="name-cell">' + esc(f.name) + '</td><td class="size-cell">' + fmt(f.size) + '</td><td class="btn-cell"></td>';
      tr.lastChild.appendChild(btn);
      tbody.appendChild(tr);
    }
  } catch (e) {
    setStatus('Cannot load server files: ' + e.message, true);
  }
}

function confirmDelete(filename) {
  document.getElementById('confirm-msg').textContent = '"' + filename + '"';
  const yes = document.getElementById('confirm-yes');
  yes.onclick = () => doDelete(filename);
  openModal('confirm-modal');
  yes.focus();
}

async function doDelete(filename) {
  closeModal('confirm-modal');
  try {
    await apiFetch(AGENT + '/files?console=' + encodeURIComponent(currentConsole) + '&file=' + encodeURIComponent(filename), { method: 'DELETE' });
    setStatus('Deleted: ' + filename);
    loadLocalFiles();
  } catch (e) {
    setStatus('Delete failed: ' + e.message, true);
  }
}

async function startTransfer(filename) {
  try {
    await apiFetch(AGENT + '/transfer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ console: currentConsole, file: filename }),
    });
    setStatus('Queued: ' + filename);
    startStatusPoll();
  } catch (e) {
    setStatus('Transfer failed: ' + e.message, true);
  }
}

function startStatusPoll() {
  if (statusPoll) return;
  statusPoll = setInterval(pollStatus, 800);
}

async function pollStatus() {
  try {
    const r = await apiFetch(AGENT + '/transfer/status');
    const data = await r.json();
    if (data.active) {
      const a = data.active;
      const pct = Math.round(a.percent || 0);
      setStatus('Transferring ' + a.file + ': ' + pct + '%  (' + fmt(a.bytes) + ' / ' + fmt(a.total) + ')');
    } else if (data.queue && data.queue.length > 0) {
      setStatus('Queued: ' + data.queue.length + ' file(s) waiting');
    } else {
      setStatus('Ready.');
      clearInterval(statusPoll);
      statusPoll = null;
      loadLocalFiles();
    }
  } catch (e) {
    clearInterval(statusPoll);
    statusPoll = null;
  }
}

// ── Saves ─────────────────────────────────────────────────────────────────────

async function loadLocalSaves() {
  try {
    const r = await apiFetch(AGENT + '/saves');
    const files = await r.json() || [];
    const tbody = document.getElementById('saves-local-body');
    tbody.innerHTML = '';
    for (const f of files) {
      const tr = document.createElement('tr');
      const btn = document.createElement('button');
      btn.className = 'action primary';
      btn.textContent = 'Push';
      btn.dataset.file = f.name;
      btn.addEventListener('click', () => pushSave(f.name));
      tr.innerHTML = '<td class="name-cell">' + esc(f.name) + '</td><td class="size-cell">' + fmt(f.size) + '</td><td class="btn-cell"></td>';
      tr.lastChild.appendChild(btn);
      tbody.appendChild(tr);
    }
  } catch (e) {
    setStatus('Cannot load local saves: ' + e.message, true);
  }
}

async function loadServerSaves() {
  if (!currentConsole) return;
  try {
    const r = await apiFetch('/api/saves?console=' + encodeURIComponent(currentConsole));
    const files = await r.json() || [];
    const tbody = document.getElementById('saves-server-body');
    tbody.innerHTML = '';
    for (const f of files) {
      const tr = document.createElement('tr');
      const btn = document.createElement('button');
      btn.className = 'action primary';
      btn.textContent = 'Pull';
      btn.dataset.file = f.name;
      btn.addEventListener('click', () => pullSave(f.name));
      tr.innerHTML = '<td class="name-cell">' + esc(f.name) + '</td><td class="size-cell">' + fmt(f.size) + '</td><td class="btn-cell"></td>';
      tr.lastChild.appendChild(btn);
      tbody.appendChild(tr);
    }
  } catch (e) {
    setStatus('Cannot load server saves: ' + e.message, true);
  }
}

async function pushSave(filename) {
  try {
    setStatus('Pushing ' + filename + '…');
    await apiFetch(AGENT + '/saves/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ console: currentConsole, file: filename }),
    });
    setStatus('Pushed: ' + filename);
    loadServerSaves();
  } catch (e) {
    setStatus('Push failed: ' + e.message, true);
  }
}

async function pullSave(filename) {
  try {
    setStatus('Pulling ' + filename + '…');
    await apiFetch(AGENT + '/saves/pull', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ console: currentConsole, file: filename }),
    });
    setStatus('Pulled: ' + filename);
    loadLocalSaves();
  } catch (e) {
    setStatus('Pull failed: ' + e.message, true);
  }
}

// ── Host config ───────────────────────────────────────────────────────────────

async function openHostConfig() {
  try {
    const r = await apiFetch('/api/hostconfig');
    const cfg = await r.json();
    document.getElementById('host-rows').innerHTML = '';
    for (const c of (cfg.consoles || [])) {
      addHostRow(c.name, c.server_path);
    }
    document.getElementById('host-saves-path').value = cfg.saves_path || '';
    openModal('host-modal');
  } catch (e) {
    setStatus('Cannot load host config: ' + e.message, true);
  }
}

function addHostRow(name, path) {
  const tr = document.createElement('tr');
  const nameTd = document.createElement('td');
  const pathTd = document.createElement('td');
  const btnTd = document.createElement('td');
  const nameIn = document.createElement('input');
  nameIn.type = 'text';
  nameIn.value = name || '';
  nameIn.placeholder = 'PS2';
  const pathIn = document.createElement('input');
  pathIn.type = 'text';
  pathIn.value = path || '';
  pathIn.placeholder = '/mnt/server-pc/Games/ROMS/PS2';
  const rem = document.createElement('button');
  rem.textContent = 'Remove';
  rem.addEventListener('click', () => tr.remove());
  nameTd.appendChild(nameIn);
  pathTd.appendChild(pathIn);
  btnTd.appendChild(rem);
  tr.append(nameTd, pathTd, btnTd);
  document.getElementById('host-rows').appendChild(tr);
}

async function saveHostConfig() {
  const rows = document.querySelectorAll('#host-rows tr');
  const consoleList = [];
  for (const tr of rows) {
    const inputs = tr.querySelectorAll('input');
    const name = inputs[0].value.trim();
    const path = inputs[1].value.trim();
    if (name && path) consoleList.push({ name, server_path: path });
  }
  const saves_path = document.getElementById('host-saves-path').value.trim();
  try {
    await apiFetch('/api/hostconfig', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ consoles: consoleList, saves_path }),
    });
    closeModal('host-modal');
    await loadConsoles();
  } catch (e) {
    setStatus('Save failed: ' + e.message, true);
  }
}

// ── Client config ─────────────────────────────────────────────────────────────

async function openClientConfig() {
  try {
    const r = await apiFetch(AGENT + '/config');
    const cfg = await r.json();
    document.getElementById('client-server-url').value = cfg.server_url || '';
    document.getElementById('client-saves-folder').value = cfg.saves_folder || '';
    const tbody = document.getElementById('client-rows');
    tbody.innerHTML = '';
    for (const c of consoles) {
      const dest = (cfg.destinations || {})[c.name] || '';
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.textContent = c.name;
      const inTd = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.dataset.console = c.name;
      inp.value = dest;
      inp.placeholder = 'path to local folder';
      inTd.appendChild(inp);
      tr.append(nameTd, inTd);
      tbody.appendChild(tr);
    }
    openModal('client-modal');
  } catch (e) {
    setStatus('Cannot load client config: ' + e.message, true);
  }
}

async function saveClientConfig() {
  const serverUrl = document.getElementById('client-server-url').value.trim();
  const savesFolder = document.getElementById('client-saves-folder').value.trim();
  const destinations = {};
  for (const inp of document.querySelectorAll('#client-rows input[data-console]')) {
    const v = inp.value.trim();
    if (v) destinations[inp.dataset.console] = v;
  }
  try {
    await apiFetch(AGENT + '/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ server_url: serverUrl, destinations, saves_folder: savesFolder }),
    });
    closeModal('client-modal');
  } catch (e) {
    setStatus('Save failed: ' + e.message, true);
  }
}

// ── Theme toggle ─────────────────────────────────────────────────────────────

function toggleTheme() {
  const html = document.documentElement;
  const current = html.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('theme', next);
}
(function() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;
})();

// Close modal when clicking outside
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});

// Close modal on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.open').forEach(m => m.classList.remove('open'));
  }
});

init();
</script>
