<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN Pastebin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1316; --surface: #151c20; --surface-2: #1c252a; --surface-3: #232d33;
    --border: #2b363c; --text: #e7edf0; --text-dim: #93a5ac; --text-faint: #5f7178;
    --accent: #5fd6c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "IBM Plex Sans", sans-serif; line-height: 1.55; padding-inline: 20px; -webkit-font-smoothing: antialiased; }
  .shell { max-width: 820px; margin-inline: auto; padding-block: 28px 64px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .back-nav { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--accent); display: inline-block; margin-bottom: 16px; }

  header { padding-bottom: 22px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  h1 { font-family: "IBM Plex Mono", monospace; font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 600; margin: 0; }

  h2 { font-family: "IBM Plex Mono", monospace; font-size: 1.05rem; font-weight: 600; margin: 0 0 14px; display: flex; align-items: baseline; gap: 10px; }
  h2 .idx { color: var(--text-faint); font-weight: 400; font-size: 0.9rem; }

  section { padding-block: 24px; border-bottom: 1px solid var(--border); }
  section:last-child { border-bottom: none; }

  textarea {
    width: 100%; height: 180px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: "IBM Plex Mono", monospace; font-size: 0.88rem;
    resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  button[type="submit"] {
    margin-top: 10px; padding: 8px 20px;
    font-family: "IBM Plex Mono", monospace; font-size: 0.82rem;
    background: var(--surface-2); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px; cursor: pointer;
  }
  button[type="submit"]:hover { background: var(--surface-3); }

  .paste-item {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 14px 16px; margin-top: 12px;
    white-space: pre-wrap; word-wrap: break-word;
    font-family: "IBM Plex Mono", monospace; font-size: 0.85rem;
  }

  .paste-meta { font-size: 0.72rem; color: var(--text-faint); margin-bottom: 8px; letter-spacing: 0.04em; }

  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--text-faint); font-size: 0.8rem; font-family: "IBM Plex Mono", monospace; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="shell">

  <header>
    <a class="back-nav" href="http://homeserver:5000">← homeserver</a>
    <div class="eyebrow">LAN service</div>
    <h1>Pastebin</h1>
  </header>

  <section>
    <h2><span class="idx">01</span> New paste</h2>
    <form method="POST">
      <textarea name="content" placeholder="Paste your text here..." required></textarea>
      <button type="submit">Save paste</button>
    </form>
  </section>

  <section>
    <h2><span class="idx">02</span> Recent pastes</h2>
    {% for id, content, time in pastes %}
    <div class="paste-item">
      <div class="paste-meta">id: {{ id }} &middot; {{ time }}</div>{{ content }}
    </div>
    {% endfor %}
  </section>

  <footer>
    <span>homeserver &middot; LAN Pastebin</span>
    <span><a href="http://homeserver:5000">← dashboard</a></span>
  </footer>

</div>
</body>
</html>
