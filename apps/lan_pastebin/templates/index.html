<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Pastebin</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; background: #f4f4f9; }
        textarea { width: 100%; height: 200px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { margin-top: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .paste-item { background: white; padding: 15px; border-radius: 5px; margin-top: 20px; border-left: 5px solid #007bff; white-space: pre-wrap; word-wrap: break-word; }
        small { color: #666; }
    </style>
</head>
<body>
    <h1>LAN Pastebin</h1>
    <form method="POST">
        <textarea name="content" placeholder="Paste your text here..." required></textarea>
        <button type="submit">Save Paste</button>
    </form>

    <hr>

    <h2>Recent Pastes</h2>
    {% for id, content, time in pastes %}
        <div class="paste-item">
            <small>ID: {{ id }} | Saved at: {{ time }}</small><br>
            {{ content }}
        </div>
    {% endfor %}
</body>
</html>
